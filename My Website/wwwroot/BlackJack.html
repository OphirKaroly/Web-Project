<!DOCTYPE html>
<html>
<head>
    <title> Black-Jack </title>
    <link rel=" stylesheet" href="style.css">
    <link rel="preload" as="fetch" href="/api/balance" crossorigin>
</head>

<body class="casino">

    <div style="display: flex; gap: 10px; align-items:center; position: absolute; top: 0; right: 20px;">
        <h1 id="balance" style="font-size:50px;"></h1>
        <img src="Cards/chip.png" style="height:60px; width:60px;">
    </div>

    <div>

        <br> <br>

        <img class="card" src="" id="c1">
        <img class="card" src="" id="c2">
        <br> <br> <br> <br> <br>

        <button id="Button1" onclick="Start()"> <h2>&nbsp;&nbsp;Start &nbsp;&nbsp;</h2></button>

        <br> <br> <br> <br> <br>
        <div style="display: flex; align-items: flex-start;">
            <div>
                <img class="card" src="" id="c3">
                <img class="card" src="" id="c4">
            </div>

            <div style=" display: flex; align-items: flex-start;" id="split"></div>
        </div>
    </div>

    <div id="betting" style="position:absolute; bottom:520px; left: 125px; height: 143px; width:440px;">
        <div style="display:flex; align-items:center; gap:10px;">
            <h1 id="bet" style="font-size:60px; margin:0;"> 25 </h1>
            <img src="Cards/chip.png" style="width:55px; height:55px;">
        </div>

        <h3 style="font-size:40px; margin:0;"> - - - - - - - - </h3>
        <h3 id="msg" class="msg" style="font-size:60px;"></h3>

        <div id="form">
            <input type="number" id="betform">
            <h3 class="msg" style="font-size:40px;"> <br>  Place Your Bet </h3>
        </div>

        <div id="reference" style="display:flex; align-items:center; gap:10px;">
            <h3 id="payout" style="font-size:60px; margin:0;"></h3>
            <img id="chip" src="Cards/chip.png" style="width:55px; height:55px; visibility:hidden">
        </div>

    </div>

    <br> <br> <br> <br> <br> <br> 

    <a href="index.html"><h2> Home Page </h2> </a>
    <button type="button" onclick="SwitchSound()" style="font-size:150%"> Switch Sound</button>

    <script src="/script.js"></script>
    <script>
        Balance();
        Bet();
    </script>
</body>
</html>
